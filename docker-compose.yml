version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: exam_mvp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exam_mvp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_mvp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
