services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: exam_mvp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exam_mvp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_mvp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exam_network

  # ----------------------------------------------------------------------------
  # Golang REST API Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam_mvp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: exam_mvp
      DB_SSLMODE: disable
      SERVER_PORT: "8081"
      JWT_SECRET: "exam_mvp_cmc_ccyber_super_secret_key_2026"
      RATE_LIMIT_DISABLED: "false"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 -O - http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - exam_network

  # ----------------------------------------------------------------------------
  # React/Vite SPA Frontend Service (Served via Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exam_mvp_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - exam_network

networks:
  exam_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
